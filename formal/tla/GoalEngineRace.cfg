\* Regression witness: the engine BEFORE the review-identity fix (Fixed = FALSE).
\* run.sh checks each property on its own and EXPECTS a counterexample for each,
\* proving these properties are sensitive to the fix (not vacuous).
SPECIFICATION Spec
CONSTANTS
  MaxGoals = 2
  RunIds = {"r1", "r2"}
  MaxEpoch = 3
  MaxCont = 1
  HardCont = 2
  MaxAttempts = 2
  MaxSysRej = 2
  MaxRid = 2
  Fixed = FALSE
CONSTRAINT Bounds
INVARIANTS LiveReviewTracked NoOrphanedProposal
PROPERTIES NoDispatchDuringLiveReview
